<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Image Map</title>
</head>

<body>

    <h1>Activity Image Map</h1>

    <p>Alyssa Schmidt</p>

    <p>September 6, 2026</p> 

    <img src="media/ch03_image-to-map.jpg"
     alt="Website development illustration"
     usemap="#imagemap">

     <map name="imagemap">

    <!-- Rectangle -->
    <area shape="rect"
          coords="1090,380,1770,480"
          href="https://www.google.com"
          alt="Google">

    <!-- Circle -->
    <area shape="circle"
          coords="1525,1490,190"
          href="https://www.wordpress.com"
          alt="WordPress">

    <!-- Polygon -->
    <area shape="poly"
          coords="660,750,910,750,910,1090,660,1090"
          href="https://www.w3schools.com"
          alt="W3Schools">

</map>

</body>

</html>
